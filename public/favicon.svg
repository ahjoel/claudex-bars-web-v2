  <rect x="25" y="36" width="14" height="1.5" rx="0.75" fill="#1e3a8a" opacity="0.5"/>
  <rect x="25" y="39" width="14" height="1.5" rx="0.75" fill="#1e3a8a" opacity="0.5"/>
  <rect x="25" y="42" width="10" height="1.5" rx="0.75" fill="#1e3a8a" opacity="0.5"/>

  <!-- Shine -->
