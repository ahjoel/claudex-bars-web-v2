name: Deploy Frontend to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build -- --configuration production

      - name: Deploy
        run: |
          rm -rf /var/www/claudex-bars-web/*
          cp -r dist/claudex-bars-web-v2/browser/* /var/www/claudex-bars-web/
