
    <div class="page-header">
      <div>
        <h1 class="page-title"><i class="fas fa-boxes me-2 text-primary"></i>Inventaire du stock</h1>
        <nav aria-label="breadcrumb">
          <ol class="breadcrumb mb-0">
            <li class="breadcrumb-item">Statistiques</li>
            <li class="breadcrumb-item active">Inventaire stock</li>
          </ol>
        </nav>
      </div>
      <button class="btn btn-outline-primary" (click)="loadData()" [disabled]="loading">
        <i class="fas fa-sync me-2"></i>Actualiser
      </button>
    </div>

    <!-- Filtre zone -->
    <div class="card-custom mb-4">
      <div class="card-header"><i class="fas fa-filter me-2"></i>Filtrer par zone</div>
      <div class="card-body">
        <div class="d-flex gap-2">
          <button type="button" class="btn fw-bold px-4"
            [class.btn-secondary]="activeZone === 'tous'"
            [class.btn-outline-secondary]="activeZone !== 'tous'"
            (click)="setZone('tous')" [disabled]="loading">
            <i class="fas fa-layer-group me-1"></i>Toutes zones
          </button>
          <button type="button" class="btn fw-bold px-4"
            [class.btn-primary]="activeZone === 'R1'"
            [class.btn-outline-primary]="activeZone !== 'R1'"
            (click)="setZone('R1')" [disabled]="loading">
            <i class="fas fa-warehouse me-1"></i>R1
          </button>
          <button type="button" class="btn fw-bold px-4"
            [class.btn-info]="activeZone === 'RC'"
            [class.btn-outline-info]="activeZone !== 'RC'"
            (click)="setZone('RC')" [disabled]="loading">
            <i class="fas fa-boxes me-1"></i>RC
          </button>
        </div>
      </div>
    </div>

    <div class="card-custom">
      <div class="card-header d-flex justify-content-between align-items-center">
        <span><i class="fas fa-list me-2"></i>Stock disponible par produit
          <span class="badge ms-2"
            [class.bg-secondary]="activeZone === 'tous'"
            [class.bg-primary]="activeZone === 'R1'"
            [class.bg-info]="activeZone === 'RC'">
            {{ filteredData.length }}
          </span>
          <span class="ms-2 text-muted small" *ngIf="activeZone !== 'tous'">
            — Zone {{ activeZone }}
          </span>
        </span>
        <button class="btn btn-sm btn-outline-danger" (click)="downloadPdf()" *ngIf="filteredData.length" [disabled]="loading">
          <i class="fas fa-file-pdf me-1"></i>Télécharger PDF
        </button>
      </div>
      <div class="card-body p-0">
        <div class="p-3">
          <app-datatable
            [data]="pagedData"
            [columns]="columns"
            [actions]="[]"
            [loading]="loading"
            [totalRecords]="filteredData.length"
            [pageSize]="pageSize"
            [currentPage]="currentPage"
            (pageChange)="onPageChange($event)"
          ></app-datatable>
        </div>
      </div>
    </div>
